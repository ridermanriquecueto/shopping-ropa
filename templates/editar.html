<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto - Shopping Ropa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .edit-container { padding: 20px; max-width: 650px; margin: auto; }
        .edit-card { background: #111; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 10px 0; 
            background: #000; color: white; border: 1px solid #444; border-radius: 6px; 
            box-sizing: border-box;
        }
        .oferta-box {
            background: #1a1a1a; padding: 15px; border-radius: 8px; 
            border: 1px solid #ffcc00; margin: 20px 0; display: flex; align-items: center; gap: 10px;
        }
        .btn-save { background: #00d4ff; color: black; border: none; padding: 15px; font-weight: bold; cursor: pointer; width: 100%; border-radius: 6px; margin-top: 20px; font-size: 1rem; }
        .btn-cancel { display: block; text-align: center; color: #888; text-decoration: none; margin-top: 15px; font-size: 0.9rem; }
        .current-img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #333; }
        
        /* Estilo para el botón de eliminar foto */
        .del-check {
            display: block; background: #330000; color: #ff4444; 
            font-size: 0.6rem; padding: 4px; border-radius: 4px; 
            border: 1px solid #660000; cursor: pointer; margin-bottom: 5px;
        }
        .del-check:hover { background: #550000; }
    </style>
</head>
<body style="background-color: #000; color: white;">

    <div class="edit-container">
        <div class="edit-card">
            <h2 style="color: #00d4ff; text-align: center;">🛠️ Editar Producto</h2>
            
            <form action="{{ url_for('update', id=p.id) }}" method="POST" enctype="multipart/form-data">
                
                <label>Nombre del Producto:</label>
                <input type="text" name="nombre" value="{{ p.nombre }}" required>
                
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Precio ($):</label>
                        <input type="number" step="0.01" name="precio" value="{{ p.precio }}" required>
                    </div>
                    <div style="flex: 1;">
                        <label style="color: #00d4ff;">Stock Actual:</label>
                        <input type="number" name="stock" value="{{ p.stock }}" required style="border-color: #00d4ff;">
                    </div>
                </div>
                
                <label>Categoría:</label>
                <select name="categoria">
                    <option value="Nenes" {% if p.categoria == 'Nenes' %}selected{% endif %}>Nenes</option>
                    <option value="Nenas" {% if p.categoria == 'Nenas' %}selected{% endif %}>Nenas</option>
                    <option value="Adulto" {% if p.categoria == 'Adulto' %}selected{% endif %}>Adulto</option>
                </select>

                <div class="oferta-box">
                    <input type="checkbox" name="oferta" style="width: 25px; height: 25px; cursor: pointer;" {% if p.oferta %}checked{% endif %}>
                    <label style="color: #ffcc00; font-weight: bold; cursor: pointer;">🔥 MARCAR COMO OFERTA</label>
                </div>

                <div style="margin-top: 20px; padding: 15px; border: 2px solid #00d4ff; border-radius: 12px; background: #080808;">
                    <h3 style="color: #00d4ff; font-size: 0.9rem; text-align: center; margin-bottom: 15px;">📸 GESTIÓN DE IMÁGENES (Máx. 6)</h3>

                    <div style="background: #111; padding: 12px; border-radius: 10px; border: 1px solid #00d4ff; margin-bottom: 15px;">
                        <p style="color: #00d4ff; font-weight: bold; font-size: 0.75rem; margin-bottom: 8px;">FOTO PORTADA:</p>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <img src="{{ url_for('static', filename='img/' + p.imagen) }}" class="current-img">
                            <input type="file" name="file1" accept="image/*" style="font-size: 0.7rem;">
                        </div>
                    </div>

                    <div style="background: #001a22; padding: 12px; border-radius: 8px; border: 1px dashed #00d4ff; margin-bottom: 20px; text-align: center;">
                        <label style="color: #fff; font-size: 0.75rem; font-weight: bold;">🚀 CARGA RÁPIDA (SUBIR VARIAS JUNTAS):</label>
                        <input type="file" name="fotos_masivas" multiple accept="image/*" style="width: 100%; margin-top: 8px; font-size: 0.7rem;">
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                        {% for i in range(2, 7) %}
                            {% set campo = 'img' ~ i %}
                            <div style="background: #1a1a1a; padding: 8px; border-radius: 8px; border: 1px solid #333; text-align: center;">
                                <span style="font-size: 0.6rem; color: #555;">Foto {{ i }}</span>
                                
                                {% if p[campo] %}
                                    <img src="{{ url_for('static', filename='img/' + p[campo]) }}" style="width: 100%; height: 50px; object-fit: cover; border-radius: 4px; margin: 5px 0;">
                                    
                                    <label class="del-check">
                                        <input type="checkbox" name="borrar_{{ campo }}" value="1" style="width: 12px; height: 12px; vertical-align: middle;"> BORRAR
                                    </label>
                                {% else %}
                                    <div style="height: 50px; background: #000; border: 1px dashed #333; display: flex; align-items: center; justify-content: center; font-size: 0.5rem; color: #444; margin: 5px 0;">VACÍO</div>
                                {% endif %}
                                
                                <input type="file" name="file{{ i }}" accept="image/*" style="font-size: 0.5rem; width: 100%;">
                            </div>
                        {% endfor %}
                    </div>
                </div>

                <button type="submit" class="btn-save">💾 GUARDAR TODOS LOS CAMBIOS</button>
                <a href="/admin" class="btn-cancel">❌ Cancelar y volver</a>
            </form>
        </div>
    </div>

</body>
</html>
