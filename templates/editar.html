<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto - Shopping Ropa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .edit-container { padding: 40px 20px; max-width: 650px; margin: auto; }
        .edit-card { background: #111; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 10px 0; 
            background: #000; color: white; border: 1px solid #444; border-radius: 6px; 
        }
        /* Estilo para el Checkbox de Oferta */
        .oferta-box {
            background: #1a1a1a; padding: 15px; border-radius: 8px; 
            border: 1px solid #ffcc00; margin: 20px 0; display: flex; align-items: center; gap: 10px;
        }
        .btn-save { background: #00d4ff; color: black; border: none; padding: 15px; font-weight: bold; cursor: pointer; width: 100%; border-radius: 6px; margin-top: 20px; font-size: 1rem; }
        .btn-cancel { display: block; text-align: center; color: #888; text-decoration: none; margin-top: 15px; font-size: 0.9rem; }
        .current-img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid #333; }
        .img-grid-edit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    </style>
</head>
<body style="background-color: #000; color: white;">

    <div class="edit-container">
        <div class="edit-card">
            <h2 style="color: #00d4ff; text-align: center;"> Editar Producto</h2>
            
            <form action="{{ url_for('update', id=p.id) }}" method="POST" enctype="multipart/form-data">
                
                <label>Nombre del Producto:</label>
                <input type="text" name="nombre" value="{{ p.nombre }}" required>
                
                <label>Precio ($):</label>
                <input type="number" step="0.01" name="precio" value="{{ p.precio }}" required>
                
                <label>Categoría:</label>
                <select name="categoria">
                    <option value="Nenes" {% if p.categoria == 'Nenes' %}selected{% endif %}>Nenes</option>
                    <option value="Nenas" {% if p.categoria == 'Nenas' %}selected{% endif %}>Nenas</option>
                    <option value="Adulto" {% if p.categoria == 'Adulto' %}selected{% endif %}>Adulto</option>
                </select>

                <div class="oferta-box">
                    <input type="checkbox" name="oferta" style="width: 25px; height: 25px; cursor: pointer;" {% if p.oferta %}checked{% endif %}>
                    <label style="color: #ffcc00; font-weight: bold; font-size: 1.1rem; cursor: pointer;">🔥 MARCAR COMO OFERTA</label>
                </div>

                <div style="margin-top: 20px; padding: 15px; border: 1px solid #333; border-radius: 8px;">
                    <p style="font-size: 0.9rem; color: #00d4ff; margin-bottom: 10px; font-weight: bold;">📸 Foto Principal Actual:</p>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <img src="{{ url_for('static', filename='img/' + p.imagen) }}" class="current-img">
                        <div style="flex-grow: 1;">
                            <label style="font-size: 0.8rem; color: #888;">Actualizar imagen principal:</label>
                            <input type="file" name="imagen">
                        </div>
                    </div>
                </div>
                <label style="color: #00d4ff; font-weight: bold;"> Stock (Cantidad):</label>
                <input type="number" name="stock" id="prod_stock" value="{{ p.stock }}" required 
                    style="border: 1px solid #00d4ff; font-weight: bold; font-size: 1.2rem; color: #00d4ff;">

                <button type="submit" class="btn-save"> GUARDAR CAMBIOS</button>
                <a href="/admin" class="btn-cancel">❌ Cancelar y volver al panel</a>
            </form>
        </div>
    </div>

</body>
</html>
